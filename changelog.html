<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CO-PARK — Değişiklik Günlüğü</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #14161b; color: #e9eaee; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; line-height: 1.6; }
    header { padding: 40px 20px 24px; text-align: center; background: radial-gradient(ellipse at top, #24324a, #14161b 70%); }
    .logo { font-size: 48px; font-weight: 900; letter-spacing: .04em; background: linear-gradient(90deg, #e8463b, #f5c518, #3bb54a, #2f7ff0, #9b59d0); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; }
    header p { margin: 4px 0 0; opacity: .75; }
    .play { display: inline-block; margin-top: 16px; background: #f5c518; color: #1c1c1c; font-weight: 800; padding: 10px 20px; border-radius: 12px; text-decoration: none; }
    main { max-width: 760px; margin: 0 auto; padding: 8px 20px 60px; }
    main > h1 { display: none; }
    main > p { opacity: .7; font-size: 14px; }
    h2 { margin: 36px 0 6px; font-size: 22px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h2 .ver { background: #2f7ff0; color: #fff; padding: 2px 12px; border-radius: 10px; }
    h2 .date { font-size: 14px; font-weight: 500; opacity: .6; }
    h2.empty { display: none; }
    h3 { margin: 16px 0 4px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
    h3.eklendi { color: #6fdc7b; } h3.değişti { color: #f5c518; } h3.düzeltildi { color: #6fb4ff; } h3.kaldırıldı { color: #ff8a80; }
    ul { margin: 0; padding-left: 20px; }
    li { margin: 4px 0; }
    code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 6px; font-size: .9em; }
    a { color: #8ab8ff; }
    footer { text-align: center; opacity: .5; font-size: 13px; padding-bottom: 30px; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./">CO-PARK</a>
    <p>Değişiklik günlüğü · güncel sürüm <b>v__APP_VERSION__</b></p>
    <a class="play" href="./">Oyuna dön</a>
  </header>
  <main><!--CHANGELOG--></main>
  <footer>Kaynak kodu: <a href="https://github.com/dorukarda/co-park">github.com/dorukarda/co-park</a></footer>
</body>
</html>
